[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "boeing-event-study"
version = "0.1.0"
description = "Reproducible Bayesian Boeing event study"
requires-python = ">=3.10"
dependencies = ["numpy>=2.2,<2.3", "pandas>=2.2,<2.4", "scipy>=1.15,<1.16", "matplotlib>=3.10,<3.11", "PyYAML>=6.0,<7"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires frozen data and generated full-run outputs"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

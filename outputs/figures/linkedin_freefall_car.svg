   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #008879" x="54" y="38.16" transform="rotate(-0 54 38.16)">FREEFALL: A RECKONING FOR BOEING</text>
  </g>
  <g id="text_17">
   <text style="font-weight: 700; font-size: 31px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #192d3a" x="54" y="83.52" transform="rotate(-0 54 83.52)">Did Freefall move</text>
  </g>
  <g id="text_18">
   <text style="font-weight: 700; font-size: 31px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #192d3a" x="54" y="123.12" transform="rotate(-0 54 123.12)">Boeing’s share price?</text>
  </g>
  <g id="text_19">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #60717d" x="54" y="159.12" transform="rotate(-0 54 159.12)">Around the Netflix release · 19 August 2026</text>
  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #192d3a" x="54" y="561.6" transform="rotate(-0 54 561.6)">No clear market response detected</text>
  </g>
  <g id="text_21">
   <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #008879" x="54" y="593.28" transform="rotate(-0 54 593.28)">Through day +10: median +1.8% · 95% interval −9.9% to +13.0%</text>
  </g>
  <g id="text_22">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #60717d" x="54" y="621.36" transform="rotate(-0 54 621.36)">The uncertainty allows both losses and gains; this does not establish no effect.</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #60717d" x="54" y="657.36" transform="rotate(-0 54 657.36)">Before event: preceding close, set to zero. Day 0 includes that day’s return.</text>
  </g>
  <g id="text_24">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #60717d" x="54" y="676.8" transform="rotate(-0 54 676.8)">Returns relative to a market-and-sector model. Overlapping news limits causal attribution.</text>
  </g>
  <g id="text_25">
